<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>Sentetik oda</title><style>html,body{margin:0;background:#000}</style></head>
<body>
<script type="module">
// A textured room with boxes, photographed as canonical cube faces from known positions and headings.
// window.capture(k) -> { name: dataURL } for the 6 faces of position k; window.truth -> positions/headings.
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const S = 512;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(S, S);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const load = (u) => new Promise((r) => new THREE.TextureLoader().load(u, (t) => { t.colorSpace = THREE.SRGBColorSpace; r(t); }));
const texs = await Promise.all(['salon', 'hero-2', 'ekipman-1', 'biz', 'yaklasim', 'spinning', 'crunch', 'pilates'].map((n) => load('data/tex/' + n + '.jpg')));
const mat = (k) => new THREE.MeshBasicMaterial({ map: texs[k % texs.length], side: THREE.DoubleSide });
// room 12 x 3.2 x 9 m, walls/floor/ceiling each a different photo
const W = 12, H = 3.2, D = 9;
const room = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), [mat(0), mat(1), mat(2), mat(3), mat(4), mat(5)]);
room.position.y = H / 2;
scene.add(room);
// some furniture so near and far features give parallax
[[-3, 0.5, -2, 1], [2.5, 0.75, 1.5, 1.5], [0.5, 0.4, -3, 0.8], [-1.5, 0.6, 2.8, 1.2], [4, 0.9, -2.5, 1.8]].forEach(([x, y, z, s], i) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(s, 2 * y, s * 0.7), mat(i + 2));
  m.position.set(x, y, z); m.rotation.y = i * 0.7; scene.add(m);
});
const cam = new THREE.PerspectiveCamera(90, 1, 0.05, 100);
cam.rotation.order = 'YXZ';
// 3 x 3 capture points 1.6 m apart, each with its own heading
const truth = [];
let k = 0;
for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) {
  truth.push({ id: 's' + (++k), pos: [-1.6 + q * 1.6, 1.5, -1.6 + r * 1.6], heading: ((k * 1.37) % 6.283) - 3.14159 });
}
const FACE = { f: [0, 0], r: [-Math.PI / 2, 0], b: [Math.PI, 0], l: [Math.PI / 2, 0], u: [0, Math.PI / 2], d: [0, -Math.PI / 2] };
window.truth = truth;
window.capture = (i) => {
  const t = truth[i], out = {};
  cam.position.set(...t.pos);
  for (const [f, [dy, p]] of Object.entries(FACE)) {
    cam.rotation.set(p, t.heading + dy, 0);
    renderer.render(scene, cam);
    out[f] = renderer.domElement.toDataURL('image/jpeg', 0.9);
  }
  return out;
};
window.ready = true;
</script>
</body>
</html>
